name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_docs.py"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_docs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs.json and MDX formatting
        run: python3 .github/scripts/check_docs.py docs

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Check for broken links
        working-directory: docs
        run: mint broken-links
